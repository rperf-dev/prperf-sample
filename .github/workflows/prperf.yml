name: prperf
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # prperf uploads authenticate via the OIDC token
      checks: write            # write the Check Run (public repo, install-free)
      pull-requests: write     # write the sticky comment
    env:
      RAILS_ENV: benchmark
      SECRET_KEY_BASE: benchmark-dummy-not-secret
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true    # reads .ruby-version
      - uses: rperf-dev/prperf-action@v1
        with:
          benchmark: report
          run: ruby bench/request.rb   # the action wraps this in `bundle exec rperf record`
          thresholds: |
            alloc: "+5%"         # a tiny allocation regression is enough to warn
